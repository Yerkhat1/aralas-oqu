name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phonology rules against attested forms
        run: node test/phonology.test.mjs
      - name: Grader and scheduler
        run: node --test test/unit/
