<!doctype html>
<html lang="ru" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Aralas — қазақ тілі</title>
<meta name="description" content="Kazakh from the rule up: vowel harmony, suffix derivation, and spaced repetition per word-and-skill.">
<meta name="theme-color" content="#12b3a0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter carries the full Kazakh Cyrillic block (ә ғ қ ң ө ұ ү һ і); most UI fonts do not. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/app.css">
</head>
<body>

<div class="app">

  <!-- ============================ HOME ============================ -->
  <section class="screen active" id="screen-home">
    <header class="topbar">
      <div class="brand">
        <div class="glyph">Aa</div>
        <div class="brand-name">Aralas</div>
      </div>
      <div class="stat stat-streak" id="hdr-streak" title="streak">🔥 <span class="num">0</span></div>
      <div class="stat stat-xp" id="hdr-xp"><span class="num">0</span> XP</div>
      <svg class="ring" viewBox="0 0 36 36" id="hdr-ring" aria-hidden="true">
        <circle class="track" cx="18" cy="18" r="15"></circle>
        <circle class="fill" cx="18" cy="18" r="15" stroke-dasharray="0 94.2"></circle>
      </svg>
    </header>
    <div class="scroll" id="home-body"></div>
  </section>

  <!-- ============================ SESSION ============================ -->
  <section class="screen" id="screen-session">
    <div class="session-top">
      <button class="icon-btn" id="session-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="17" height="17">
          <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="session-bar"><i id="session-progress" style="width:0%"></i></div>
      <div class="stat stat-xp"><span class="num" id="session-xp">0</span></div>
    </div>
    <div class="q" id="q-body"></div>
    <div class="actionbar" id="action-bar"></div>
  </section>

  <!-- ============================ GRAMMAR ============================ -->
  <section class="screen" id="screen-grammar">
    <header class="topbar">
      <div class="brand"><div class="brand-name" id="grammar-title">Правила</div></div>
    </header>
    <div class="scroll" id="grammar-body"></div>
  </section>

  <!-- ============================ PROFILE ============================ -->
  <section class="screen" id="screen-profile">
    <header class="topbar">
      <div class="brand"><div class="brand-name" id="profile-title">Профиль</div></div>
    </header>
    <div class="scroll" id="profile-body"></div>
  </section>

  <!-- ============================ NAV ============================ -->
  <nav class="nav" id="nav">
    <button data-screen="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
      </svg>
      <span data-i18n="learn">Учить</span>
    </button>
    <button data-screen="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
      <span data-i18n="review">Повтор</span>
      <em class="badge" id="due-badge" hidden></em>
    </button>
    <button data-screen="grammar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 7h8M8 11h5"/>
      </svg>
      <span data-i18n="grammar">Правила</span>
    </button>
    <button data-screen="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
      </svg>
      <span data-i18n="profile">Профиль</span>
    </button>
  </nav>

</div>

<script type="module" src="src/js/app.js"></script>
</body>
</html>
